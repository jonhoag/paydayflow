# Checks the website, then publishes it to GitHub Pages: only the files the site needs, never the tests or the deploy
# scripts. A pull request runs the checks only; publishing happens from main, and only when every check passes.
# Each action is pinned to an exact commit (its version is in the comment beside it).
name: Publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The stylesheet matches the page
        run: node build-css.js --check
      - name: Spending summary
        run: node tests/spending.test.js
      # The browser tests drive the runner's own Chrome. playwright-core has no dependencies of its own; it is
      # pinned to an exact version and its install scripts are not run.
      - name: Install the browser driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.64.1
      - name: Service worker (real Chrome)
        run: node tests/sw.test.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Screens and buttons (real Chrome)
        run: node tests/ui-flows.test.js
        env:
          CHROME_PATH: /usr/bin/google-chrome

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html sw.js manifest.json tailwind.css CNAME _site/
          cp -r icons fonts _site/
          find _site -type f | sort
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
