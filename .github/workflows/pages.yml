# Checks the website, then publishes it to GitHub Pages: only the files the site needs, never the tests or the deploy
# scripts. A pull request runs the checks only; publishing happens from main, and only when every check passes.
# Each action is pinned to an exact commit (its version is in the comment beside it).
name: Publish site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || format('pages-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tailwind (for the stylesheet check) and playwright-core (the browser tests drive the runner's own Chrome), at
      # the exact versions and hashes in package-lock.json. No install scripts are run.
      - name: Install the build and test tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The stylesheet matches the page and app.js
        run: node build-css.js --check
      # The service worker only saves and opens files whose hashes it holds. With stale hashes a new version can't
      # install (devices stay on the old one, and new visitors get no offline copy), so they fail the build.
      - name: The page's ?v= stamps and the service worker's file hashes match the site files
        run: node build-sw.js --check
      - name: Spending summary
        run: node tests/spending.test.js
      - name: Service worker (real Chrome)
        run: node tests/sw.test.js
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Screens and buttons (real Chrome)
        run: node tests/ui-flows.test.js
        env:
          CHROME_PATH: /usr/bin/google-chrome

  build:
    needs: test
    # Only main is ever published (a manual run from another branch only runs the tests).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Exactly the files listed in build-sw.js (siteFiles, plus sw.js and CNAME), nothing else.
      - name: Collect the site files
        run: node build-sw.js --collect _site
      # The very bytes about to be published (line endings included) must match the page's ?v= stamps and the hashes
      # in the published sw.js.
      - name: The collected files match the service worker's hashes
        run: node build-sw.js --published _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
