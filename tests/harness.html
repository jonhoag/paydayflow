<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>PaydayFlow test harness</title></head>
<body>
<script>
// Loads the real ../index.html with a mocked Apps Script backend and a mocked Google sign-in.
// Query params: ?token=none  -> start signed out (expired token)
//               ?latency=400 -> mock server delay in ms (default 300)
//               ?evil=1      -> seed hostile text (quotes, tags, attribute break-outs) wherever sheet or server text shows
//               ?noconfig=1  -> the server sends no names (like an older backend)
//               ?gas=1       -> run as the copy of the page Apps Script serves (google.script.run), same mock server
// Every name, shop and figure here is invented.
// The mock "server" runs each request the moment it arrives, then replies after its latency, so
// replies can overtake each other exactly like real Apps Script. MOCK.nextLatencies = [1500, 100]
// gives the next requests custom delays.
(function () {
  const q = new URLSearchParams(location.search);
  const b64 = o => btoa(JSON.stringify(o)).replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
  const makeToken = (email, ttl) => 'h.' + b64({ email, exp: Math.floor(Date.now() / 1000) + (ttl || 3600) }) + '.s';

  // ---------- mock sheet (two months) ----------
  const MONTH = 'Test Payday 2026';
  const MONTH2 = 'Other Payday 2026';
  const db = {
    checking: [{ row: 4, desc: 'start', amount: 1000, need: false }, { row: 5, desc: 'paycheck', amount: 2000, need: false }],
    amex: [{ row: 4, desc: 'start', amount: 0 }],
    barclays: [{ row: 4, desc: 'start', amount: 0 }],
    marcus: [{ row: 4, desc: 'start', amount: 500 }],
    budgets: [{ row: 4, name: 'mortgage', amount: -800, originalBudget: -800, isRecurring: true }]
  };
  const db2 = {
    checking: [{ row: 4, desc: 'start', amount: 50, need: false }],
    amex: [{ row: 4, desc: 'start', amount: 0 }, { row: 5, desc: 'OTHER MONTH item', amount: -9 }],
    barclays: [{ row: 4, desc: 'start', amount: 0 }],
    marcus: [{ row: 4, desc: 'start', amount: 0 }],
    budgets: []
  };
  // ?demo=1 seeds realistic-looking (but made-up) data so screenshots resemble the real app.
  if (q.get('demo')) {
    const rowsOf = list => list.map((r, i) => ({ row: 4 + i, ...r }));
    db.checking = rowsOf([{ desc: 'Start', amount: 1850 }, { desc: 'paycheck', amount: 2600 }, { desc: 'me to savings', amount: -500 },
      { desc: 'robin Lunch', amount: 9.6, need: true }, { desc: 'robin Cinema', amount: 7.5, need: true }, { desc: 'robin Snacks', amount: 4.2, need: true },
      { desc: 'sam Taxi', amount: 24 }, { desc: 'kim Bus', amount: 3.2 }, { desc: 'kim Groceries', amount: 36.8 }, { desc: 'To savings', amount: -300 }]);
    db.amex = rowsOf([{ desc: 'Start', amount: -312.4 }, { desc: 'Bus fare', amount: -3.2 }, { desc: 'Lidl', amount: -73.6 }, { desc: 'Bowling alley', amount: -28 }, { desc: 'Music sub', amount: -11.99 }]);
    db.barclays = rowsOf([{ desc: 'Start', amount: -1240.15 }]);
    db.marcus = rowsOf([{ desc: 'Start', amount: 2750 }, { desc: 'Monthly savings', amount: 500 }, { desc: 'Holiday pot', amount: 300 }]);
    db.budgets = rowsOf([['Groceries wk 1', -45, true], ['Fuel wk 2', -35, true], ['Groceries wk 3', -45, true], ['Account fee', -20, true], ['Music sub', -12, true],
      ['Mortgage', -850, true], ['Broadband', -45, true], ['TV package', -60, true], ['Energy', -110, true], ['Optician', -30, false], ['Birthday gifts', -120, false]]
      .map(([name, amount, isRecurring]) => ({ name, amount, originalBudget: amount, isRecurring })));
  }
  const dbs = { [MONTH]: db, [MONTH2]: db2 };
  // ?evil=1 seeds hostile text: quotes, tags, a backslash, and attempts to break out of an attribute or a handler.
  // Any of it running sets window.__pwned (the screen tests check it never does).
  const EVIL = `O'Brien "Quote" <b>bold</b> \\back & co`;
  const EVIL2 = `"><img src=x onerror="window.__pwned=1">' onmouseover='window.__pwned=2' x=');window.__pwned=3;//`;
  const EVIL_MONTH = 'Evil "Month" <img src=x onerror=window.__pwned=4> 2026';
  if (q.get('evil')) {
    db.amex.push({ row: 5, desc: EVIL, amount: -3 }, { row: 6, desc: EVIL2, amount: -4 });
    db.barclays.push({ row: 5, desc: EVIL2, amount: -5 });
    db.marcus.push({ row: 5, desc: EVIL2, amount: 6 });
    db.checking.push({ row: 6, desc: 'kim ' + EVIL, amount: 3, need: true }, { row: 7, desc: 'kim ' + EVIL2, amount: 2, need: true }, { row: 8, desc: EVIL2, amount: -1 });
    db.budgets.push({ row: 5, name: EVIL, amount: -7, originalBudget: -7, isRecurring: false }, { row: 6, name: EVIL2, amount: -8, originalBudget: -8, isRecurring: true });
    // Names every object has, as an Owed person and as card spends.
    db.checking.push({ row: 9, desc: 'constructor Lunch', amount: 4, need: true }, { row: 10, desc: '__proto__ Taxi', amount: 5, need: true });
    db.amex.push({ row: 7, desc: '__proto__', amount: -6 }, { row: 8, desc: 'constructor', amount: -7 });
  }
  const MONTH_LIST = q.get('evil') ? [MONTH, MONTH2, EVIL_MONTH] : [MONTH, MONTH2];
  // The names the backend sends with every reply (the real ones live only in the private backend).
  const CONFIG = q.get('noconfig') ? null
    : { people: ['kim', 'lee', 'robin', 'sam', 'jo'], quickSplit: 'kim', spendWords: { 'Entertainment': ['bowling'] } };
  const sum = a => +a.reduce((t, x) => t + Number(x.amount || 0), 0).toFixed(2);
  // Like the server's add-times: kept per month by account|row for every add and move (dropped on delete), and sent
  // as each row's clientTs. Rows put straight into the pretend sheet have none, like rows typed into the real one.
  const times = new Map();
  const timesOf = d => { if (!times.has(d)) times.set(d, {}); return times.get(d); };
  // A new entry in a month's next row of that account, with its add-time; "need" (owed) only on Nationwide.
  const pushRow = (d, acct, desc, amount, need, ts) => {
    const row = nextRow(d[acct]);
    d[acct].push({ row, desc, amount, ...(acct === 'checking' ? { need: !!need } : {}) });
    timesOf(d)[acct + '|' + row] = ts;
  };
  const rev = (arr, acct, d) => arr.slice().reverse().map(r => ({ ...r, acct, clientTs: timesOf(d)[acct + '|' + r.row] || 0 }));
  function snapshot(d = db, name = MONTH) {
    const nCA = sum(d.checking), amex = sum(d.amex), barclays = sum(d.barclays);
    const budgetRem = sum(d.budgets);
    return {
      ...(MOCK.config ? { config: JSON.parse(JSON.stringify(MOCK.config)) } : {}),
      sheetUrl: '#', availableMonths: MONTH_LIST, activeMonth: name,
      checking: rev(d.checking, 'checking', d), marcus: rev(d.marcus, 'marcus', d),
      barclays: rev(d.barclays, 'barclays', d), amex: rev(d.amex, 'amex', d),
      budgets: JSON.parse(JSON.stringify(d.budgets)),
      summary: { nCA, mSAV: sum(d.marcus), amex, barclays, budgetRem, checkingExpected: +(nCA + budgetRem).toFixed(2), eomSavingsJ: +(nCA + budgetRem + amex + barclays).toFixed(2) }
    };
  }
  const nextRow = arr => Math.max(3, ...arr.map(r => r.row)) + 1;
  // Refusals carry a code, like the real server's (ERROR CODES in Code.js; tests/private/mock-contract.test.js checks the
  // list matches). MOCK.failWith and MOCK.authError are { code, error }, or just words, which are sent as ERROR.
  const ERROR_CODES = ['AUTH_REQUIRED', 'AUTH_EXPIRED', 'AUTH_FAILED', 'AUTH_THROTTLED', 'AUTH_PASSKEY_UNKNOWN', 'FORBIDDEN',
    'AUTH_UNAVAILABLE', 'BUSY', 'STALE', 'SAVED_NO_STATE', 'EXISTS', 'REAUTH'];
  const coded = (code, error) => Object.assign(new Error(error), { code });
  const refusal = f => {
    const r = f && typeof f === 'object' ? { ok: false, code: f.code || 'ERROR', error: f.error || f.message } : { ok: false, code: 'ERROR', error: f };
    if (r.code !== 'ERROR' && !ERROR_CODES.includes(r.code)) throw new Error('The test server was given a code the backend never sends: ' + r.code);
    return r;
  };

  // Like the real server: refuse a change to a row that no longer holds what the page expected. Bills are named by
  // `name`, everything else by `desc`.
  const checkExpect = (it, p, key = 'desc') => {
    if (p.expect && (!it || it[key] !== p.expect[key] || Math.abs(it.amount - p.expect.amount) >= 0.005)) {
      throw coded('STALE', 'STALE: This entry was changed on another device.');
    }
  };

  const MOCK = window.MOCK = {
    latency: Number(q.get('latency') || 300),
    nextLatencies: [],    // consumed one per request before falling back to `latency`
    failNext: 0,          // number of upcoming write calls that should fail
    failWith: 'Mock server failure',   // what the server says when it fails one of them (or { code, error })
    failAfterWriteNext: 0,   // number of upcoming write calls that do their work, then reply with an error
    badReplyNext: 0,      // number of upcoming calls that get a page that isn't JSON (like Google's error page)
    dropNext: 0,          // number of upcoming calls of any kind that get no reply (like a lost connection)
    dropReadsNext: 0,     // number of upcoming sheet reads (not writes) that get no reply
    summaryOff: 0,        // audit 3.3 test: added to every figure in the summary the server sends, which the page must not use
    authError: null,      // set to an error text (or { code, error }) and the server turns down every request as a sign-in problem
    config: CONFIG,       // the names sent with every reply (null: none, like an older backend)
    categoryChoices: {},  // the mock server's saved Spending category choices
    calls: [],            // log of { action, payload, start, end }
    db, db2, dbs, snapshot, MONTH, MONTH2,
    makeToken,
    gsiCallback: null,
    gsiAccount: null,     // the account Google would sign in automatically (null: none)
    gsi: { initialize: 0, prompt: 0, disableAutoSelect: 0 }   // calls to the pretend Google sign-in
  };

  const seenClientIds = new Set();
  const handlers = {
    getCachedSheetState: (p, d, n) => snapshot(d, n),
    addTransactionBundle: (p, d, n) => {
      // Like the server, a repeat of a spend already saved (same clientId) is ignored.
      if (p.clientId && seenClientIds.has(p.clientId)) return snapshot(d, n);
      if (p.clientId) seenClientIds.add(p.clientId);
      // Like the server: the spend on its card; a savings share as a Marcus row and a "savings" Nationwide row; each
      // person's share as "<person> <shop>" (owed to you on a spend, by you on a refund).
      const now = Date.now(), sign = p.isRefund ? -1 : 1, money = x => +Math.abs(Number(x) || 0).toFixed(2);
      const add = (...a) => pushRow(d, ...a);
      add(p.account, p.merchant, -sign * money(p.grossAmount), false, now);
      const mAmt = money(p.marcusShare);
      if (mAmt > 0) {
        add('marcus', p.merchant, -sign * mAmt, false, now - 1);
        add('checking', 'savings ' + p.merchant, sign * mAmt, p.markNeed, now - 2);
      }
      (p.splits || []).filter(sp => sp && Number(sp.amount) > 0)   // a share of 0 or less is left out
        .forEach((sp, i) => add('checking', String(sp.person).trim().toLowerCase() + ' ' + p.merchant, +(sign * money(sp.amount)).toFixed(2), sp.need, now - 3 - i));
      return snapshot(d, n);
    },
    editOrMoveTransaction: (p, d, n) => {
      const it = d[p.oldAcct].find(r => r.row === Number(p.row));
      checkExpect(it, p);
      if (it) { it.desc = p.newDesc; it.amount = p.newAmount; }
      if (it && p.newAcct && p.newAcct !== p.oldAcct) {   // a move: to the new account's next row, with a new time
        d[p.oldAcct].splice(d[p.oldAcct].indexOf(it), 1);
        delete timesOf(d)[p.oldAcct + '|' + it.row];
        it.row = nextRow(d[p.newAcct]);
        d[p.newAcct].push(it);
        timesOf(d)[p.newAcct + '|' + it.row] = Date.now();
      }
      return snapshot(d, n);
    },
    deleteTransactionRow: (p, d, n) => {
      const i = d[p.acct].findIndex(r => r.row === Number(p.row));
      checkExpect(d[p.acct][i], p);
      if (i > -1) { delete timesOf(d)[p.acct + '|' + d[p.acct][i].row]; d[p.acct].splice(i, 1); }
      return snapshot(d, n);
    },
    toggleNeedFlag: (p, d, n) => { const it = d.checking.find(r => r.row === Number(p.row)); checkExpect(it, p); if (it) it.need = !!p.setNeed; return snapshot(d, n); },
    // Like the server: every row is checked before any is changed.
    settleAllNeeds: (p, d, n) => {
      const rows = (p.rows || []).map(Number);
      if (rows.length && (!Array.isArray(p.expect) || p.expect.length !== rows.length)) throw coded('STALE', 'STALE: This entry was changed on another device.');
      const its = rows.map((row, i) => { const it = d.checking.find(r => r.row === row); checkExpect(it, { expect: p.expect[i] }); return it; });
      its.forEach(it => { it.need = false; });
      return snapshot(d, n);
    },
    updateBudgetRow: (p, d, n) => { const it = d.budgets.find(b => b.row === Number(p.row)); checkExpect(it, p, 'name'); if (it) it.amount = Number(p.newAmount); return snapshot(d, n); },
    saveBudgetItem: (p, d, n) => {
      if (p.row) { const it = d.budgets.find(b => b.row === Number(p.row)); checkExpect(it, p, 'name'); if (it) Object.assign(it, { name: p.name, amount: p.amount, originalBudget: p.amount, isRecurring: !!p.isRecurring }); }
      else d.budgets.push({ row: nextRow(d.budgets), name: p.name, amount: p.paid === true ? 0 : p.amount, originalBudget: p.amount, isRecurring: !!p.isRecurring });
      return snapshot(d, n);
    },
    deleteBudgetItem: (p, d, n) => { const i = d.budgets.findIndex(b => b.row === Number(p.row)); checkExpect(d.budgets[i], p, 'name'); if (i > -1) d.budgets.splice(i, 1); return snapshot(d, n); },
    // Like the real server: builds the new month from the one it starts from (closing balances as its start rows,
    // the pay, the savings transfer, what is still owed, and the bills asked for at their full amounts) and puts it
    // first in the month list. A month of that name is only replaced when the page says so. What this changes stays
    // for the rest of that test page (a replaced month keeps its new rows, new months stay at the front of the list),
    // so a step that makes a month opens the one it needs afterwards.
    startNewMonth: (p, d, n) => {
      const name = String(p.newMonthName || '').trim();
      if (!name || name.length > 85 || name.charAt(0) === '_' || name === n) throw new Error('Invalid month name.');
      if (dbs[name] && p.replaceExisting !== true) throw coded('EXISTS', 'EXISTS: There is already a month called "' + name + '". Nothing was changed.');
      if (!Array.isArray(p.keepBudgetRows)) throw new Error('Say which bills to carry over (keepBudgetRows).');
      const was = snapshot(d, n).summary, now = Date.now();
      const pay = Number(p.paycheck) || 0, sav = Math.abs(Number(p.savingsAmount) || 0);
      const owed = d.checking.filter(r => r.need);
      const m = {
        checking: [{ row: 4, desc: 'start', amount: +(was.nCA - sum(owed)).toFixed(2), need: false }],
        amex: [{ row: 4, desc: 'start', amount: was.amex }], barclays: [{ row: 4, desc: 'start', amount: was.barclays }],
        marcus: [{ row: 4, desc: 'start', amount: was.mSAV }], budgets: []
      };
      times.set(m, {});
      const add = (...a) => pushRow(m, ...a);
      if (pay > 0) add('checking', 'paycheck', pay, false, now - 2);
      if (sav > 0) { add('checking', 'me to savings', -sav, false, now - 1); add('marcus', 'my savings', sav, false, now); }
      owed.forEach((r, i) => add('checking', r.desc, r.amount, true, now - 100 + i));
      const keep = new Set(p.keepBudgetRows.map(Number));
      d.budgets.filter(b => keep.has(Number(b.row))).forEach((b, i) => {
        const amount = b.originalBudget !== 0 && b.originalBudget != null ? b.originalBudget : b.amount;
        // Bills fill rows 4-32, then 40 on (the sheet's Money Left box sits in 33-39).
        m.budgets.push({ row: 4 + i + (i >= 29 ? 7 : 0), name: b.name, amount, originalBudget: amount, isRecurring: !!b.isRecurring });
      });
      if (dbs[name]) { Object.assign(dbs[name], m); times.set(dbs[name], times.get(m)); }   // replaced: the same object, so MOCK.db / MOCK.db2 still point at it
      else dbs[name] = m;
      const at = MONTH_LIST.indexOf(name);
      if (at > -1) MONTH_LIST.splice(at, 1);
      MONTH_LIST.unshift(name);
      return snapshot(dbs[name], name);
    },
    // Remembered for this tab, because Sign out reloads the page (and with it this pretend server).
    passkeyRemove: p => { try { sessionStorage.setItem('mock_passkey_removed', String(p.credentialId)); } catch (e) {} return { passkeys: [] }; },
    // One pretend device. Its id holds a quote, as a check that ids reach the click handler as data, not as script.
    passkeyList: () => ({ passkeys: [{ id: "dev'1", label: 'Test phone', created: '2026-11-01T10:00:00Z', lastUsed: null }]
      .concat(q.get('evil') ? [{ id: EVIL2, label: EVIL2, created: '2026-11-02T10:00:00Z', lastUsed: '2026-11-03T10:00:00Z' }] : []) }),
    getCategoryChoices: () => ({ choices: JSON.parse(JSON.stringify(MOCK.categoryChoices)) }),
    setCategoryChoice: p => {
      const k = String(p.merchant || '').trim().toLowerCase();
      delete MOCK.categoryChoices[k];
      if (p.category) MOCK.categoryChoices[k] = p.category;
      return { choices: JSON.parse(JSON.stringify(MOCK.categoryChoices)) };
    }
  };

  window.fetch = async function (url, opts) {
    const body = JSON.parse(opts.body);
    const call = { action: body.action, payload: body.payload, start: Date.now(), end: null };
    MOCK.calls.push(call);
    const wait = MOCK.nextLatencies.length ? MOCK.nextLatencies.shift() : MOCK.latency;
    const isWrite = body.action !== 'getCachedSheetState';
    const drop = MOCK.dropNext > 0 ? 'dropNext' : !isWrite && MOCK.dropReadsNext > 0 ? 'dropReadsNext' : null;
    if (drop) {
      MOCK[drop]--;
      await new Promise(r => setTimeout(r, wait));
      call.end = Date.now();
      throw new TypeError('Failed to fetch');
    }

    // The server does its work as soon as the request arrives...
    let reply;
    if (MOCK.authError) {
      reply = Object.assign(refusal(MOCK.authError), { authError: true });
    } else if (isWrite && MOCK.failNext > 0) {
      MOCK.failNext--;
      reply = refusal(MOCK.failWith);
    } else if (!handlers[body.action]) {
      reply = refusal('Unknown action ' + body.action);
    } else {
      const p = body.payload || {};
      const name = dbs[p.sheetName || p.sourceSheetName] ? (p.sheetName || p.sourceSheetName) : MONTH;
      try { reply = { ok: true, data: handlers[body.action](p, dbs[name], name) }; }
      catch (e) { reply = refusal(e); }
      if (isWrite && reply.ok && MOCK.failAfterWriteNext > 0) { MOCK.failAfterWriteNext--; reply = refusal(MOCK.failWith); }
      if (reply.ok && MOCK.summaryOff && reply.data && reply.data.summary) {
        reply.data.summary = Object.fromEntries(Object.entries(reply.data.summary).map(([k, v]) => [k, +(v + MOCK.summaryOff).toFixed(2)]));
      }
    }
    // ...but the reply reaches the browser only after its latency.
    await new Promise(r => setTimeout(r, wait));
    call.end = Date.now();
    if (MOCK.badReplyNext > 0) {   // the work was done, but the reply that comes back can't be read
      MOCK.badReplyNext--;
      return { text: async () => '<!DOCTYPE html><html><body>Error 500 (Server Error)</body></html>' };
    }
    return { text: async () => JSON.stringify(reply) };
  };

  // ---------- mock Google Identity Services ----------
  // Like the real one, with auto_select a prompt() signs the remembered account (MOCK.gsiAccount) straight back in,
  // until disableAutoSelect() is called. That is what would loop if the page let a refused account straight back in.
  let gsiCfg = {}, gsiAutoOff = false;
  window.google = { accounts: { id: {
    initialize: cfg => { MOCK.gsi.initialize++; gsiCfg = cfg; MOCK.gsiCallback = cfg.callback; },
    renderButton: () => {},
    prompt: () => {
      MOCK.gsi.prompt++;
      if (gsiCfg.auto_select && !gsiAutoOff && MOCK.gsiAccount) setTimeout(() => gsiCfg.callback({ credential: makeToken(MOCK.gsiAccount) }), 30);
    },
    disableAutoSelect: () => { MOCK.gsi.disableAutoSelect++; gsiAutoOff = true; }
  } } };

  // ?gas=1: google.script.run goes to the same mock server. A failure reaches the page as an Error whose text starts
  // "Error: " (as Apps Script may send it), then the code in brackets, as gasCall sends it; a lost connection is an
  // error named NetworkError.
  if (q.get('gas')) window.google.script = { get run() {
    let ok = () => {}, fail = () => {};
    const r = {
      withSuccessHandler: f => { ok = f; return r; },
      withFailureHandler: f => { fail = f; return r; },
      gasCall: (action, payload) => {
        window.fetch('gas', { body: JSON.stringify({ action, payload }) })
          .then(res => res.text()).then(t => { const j = JSON.parse(t); if (j.ok) ok(j.data); else fail(new Error('Error: [' + j.code + '] ' + j.error)); })
          .catch(e => fail(e instanceof TypeError ? Object.assign(new Error('Connection failure due to HTTP 0'), { name: 'NetworkError' }) : e));
      }
    };
    return r;
  } };

  // ---------- load timing: ms from harness start until styles apply / first data renders ----------
  const perf = window.__perf = { t0: performance.now(), styled: null, data: null };
  const poll = setInterval(() => {
    const now = performance.now() - perf.t0;
    const body = document.body;
    // "styled" = body got a Tailwind background (light or dark); "data" = KPI no longer shows the static placeholder.
    if (perf.styled == null && body && getComputedStyle(body).backgroundColor !== 'rgba(0, 0, 0, 0)') perf.styled = Math.round(now);
    const k = document.getElementById('kpiNCA');
    if (perf.data == null && k && k.textContent && k.textContent !== '£—' && /^£|^[-−]£/.test(k.textContent)) perf.data = Math.round(now);
    if ((perf.styled != null && perf.data != null) || now > 15000) clearInterval(poll);
  }, 5);

  // ---------- style capture: records every element's computed styles in several UI states ----------
  // Used to prove two builds of the page look identical: capture each, then compareCaptures(a, b).
  const STYLE_PROPS = ['display', 'position', 'top', 'right', 'bottom', 'left', 'z-index', 'width', 'height', 'min-width', 'max-width', 'min-height', 'max-height',
    'margin-top', 'margin-right', 'margin-bottom', 'margin-left', 'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
    'color', 'background-color', 'background-image', 'opacity', 'font-family', 'font-size', 'font-weight', 'font-style', 'line-height', 'letter-spacing',
    'text-align', 'text-transform', 'text-decoration-line', 'white-space', 'overflow-x', 'overflow-y', 'text-overflow',
    'border-top-width', 'border-right-width', 'border-bottom-width', 'border-left-width', 'border-top-style', 'border-top-color', 'border-bottom-color',
    'border-left-color', 'border-right-color', 'border-top-left-radius', 'border-bottom-right-radius', 'box-shadow', 'transform', 'cursor',
    'flex-direction', 'flex-wrap', 'flex-grow', 'flex-shrink', 'align-items', 'justify-content', 'gap', 'grid-template-columns', 'pointer-events',
    'backdrop-filter', 'object-fit', 'appearance', 'outline-style', 'list-style-type', 'vertical-align', 'visibility'];
  const STATES = [
    ['overview-light', () => { localStorage.setItem('pf_theme_mode', 'light'); applyThemeMode(); }],
    ['overview-dark', () => { localStorage.setItem('pf_theme_mode', 'dark'); applyThemeMode(); }],
    ['bills-tab', () => { setView('budgets'); }],
    ['add-modal-custom-split', () => { setView('home'); openAddModal(); selectSplit('custom'); }],
    ['edit-modal', () => { closeAddModal(); openEditTxForRow('amex', 5); }],
    ['budget-form', () => { closeEditTxModal(); openBudgetForm('', '', '', false); }],
    ['new-month-modal', () => { closeBudgetForm(); openNewMonthModal(); }],
    ['lock-screen', () => { closeNewMonthModal(); document.getElementById('authLockScreen').style.display = 'flex'; }],
    ['toast', () => { document.getElementById('authLockScreen').style.display = 'none'; showToast('Couldn\'t save the thing - refreshing.'); }],
    ['light-again', () => { document.getElementById('toast').classList.add('hidden'); localStorage.setItem('pf_theme_mode', 'light'); applyThemeMode(); }],
  ];
  window.captureAll = async function (key) {
    const frame = () => new Promise(r => setTimeout(r, 60));
    const out = { width: innerWidth, states: {}, descs: [] };
    for (const [name, apply] of STATES) {
      apply(); await frame();
      const rows = [];
      document.body.querySelectorAll('*').forEach((el, i) => {
        if (['SCRIPT', 'STYLE', 'LINK', 'NOSCRIPT'].includes(el.tagName)) return;
        const cs = getComputedStyle(el);
        rows.push(STYLE_PROPS.map(p => cs.getPropertyValue(p)).join('|'));
        if (!out.descs[rows.length - 1]) out.descs[rows.length - 1] = el.tagName.toLowerCase() + '.' + String(el.getAttribute('class') || '').slice(0, 50) + (el.id ? '#' + el.id : '');
      });
      out.states[name] = rows;
    }
    sessionStorage.setItem('cap_' + key, JSON.stringify(out));
    return { key, width: out.width, states: Object.keys(out.states).length, elements: out.states['overview-light'].length };
  };
  window.compareCaptures = function (keyA, keyB) {
    const a = JSON.parse(sessionStorage.getItem('cap_' + keyA)), b = JSON.parse(sessionStorage.getItem('cap_' + keyB));
    const res = { widths: [a.width, b.width], differingElements: 0, totalElements: 0, examples: [] };
    for (const state of Object.keys(a.states)) {
      const ra = a.states[state], rb = b.states[state];
      if (ra.length !== rb.length) { res.examples.push(state + ': element count ' + ra.length + ' vs ' + rb.length); continue; }
      for (let i = 0; i < ra.length; i++) {
        res.totalElements++;
        if (ra[i] === rb[i]) continue;
        res.differingElements++;
        if (res.examples.length < 15) {
          const pa = ra[i].split('|'), pb = rb[i].split('|');
          const diffs = STYLE_PROPS.map((p, k) => pa[k] !== pb[k] ? p + ': ' + pa[k] + ' -> ' + pb[k] : null).filter(Boolean);
          res.examples.push(state + ' | ' + a.descs[i] + ' | ' + diffs.slice(0, 4).join('; '));
        }
      }
    }
    return res;
  };

  // ---------- sign-in state ----------
  // The reload after Sign out keeps what the page left behind, and Google still remembers the account (as the real
  // one would), so the test can see that it does not sign straight back in.
  try {
    if (sessionStorage.getItem('pf_signed_out') === '1') MOCK.gsiAccount = 'owner@example.com';
    else {
      if (q.get('keep') !== '1') localStorage.clear();   // ?keep=1: the app opened again, with what this device saved
      if (q.get('token') !== 'none') localStorage.setItem('pf_google_id_token', makeToken('owner@example.com'));
    }
  } catch (e) {}
})();
</script>
<script>
// Separate block so the mock fetch above is already installed; we need the REAL fetch to read index.html.
(async function () {
  const xhr = new XMLHttpRequest();
  xhr.open('GET', new URLSearchParams(location.search).get('src') || '/index.html', false);
  xhr.send();
  let html = xhr.responseText;
  // The page is served from /tests/ here, so make its relative links (tailwind.css, sw.js...) resolve from the root.
  html = html.replace(/<head>/i, '<head><base href="/">');
  // The page's own scripts (guard.js, then app.js) are added straight after it is written, in that order, rather than
  // written with it: Chrome sometimes drops a script that document.write() asks for (its request is aborted), and the
  // app would never start. They still load from this site under the page's security policy. So here guard.js runs
  // once the page is drawn, not before; the screen tests check from the source that the real page has it in <head>.
  // ?noguard=1 leaves guard.js out, as if it never arrived.
  let scripts = [];
  html = html.replace(/<script src="([^"]+)"><\/script>/g, (all, src) => { scripts.push(src); return ''; });
  if (new URLSearchParams(location.search).get('noguard')) scripts = scripts.filter(src => !/^guard\.js/.test(src));
  // Written once this harness has finished parsing. While its own parser is running, document.open() does nothing
  // and the page would land inside the harness's <body>, where the browser ignores the page's security policy tag.
  // Anything a security policy refuses (an inline handler, a script from elsewhere) is reported as an error, which
  // fails the screen tests. Added after document.open(), which drops the listeners added before it.
  const write = () => {
    document.open();
    document.addEventListener('securitypolicyviolation', e => console.error('Security policy refused (' + e.effectiveDirective + '): ' + (e.sample || e.blockedURI)));
    document.write(html);
    document.close();
    for (const src of scripts) {
      const s = document.createElement('script');
      s.src = src;
      s.async = false;   // run in order
      document.body.appendChild(s);
    }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', write); else write();
})();
</script>
